<script>
    const canvas = document.getElementById('glcanvas');
    if (canvas) {
        const gl = canvas.getContext('webgl');
        
        if (gl) {
            const vsSource = `
                attribute vec4 aVertexPosition;
                attribute vec2 aTextureCoord;
                varying highp vec2 v_texCoord;
                void main(void) {
                    gl_Position = aVertexPosition;
                    v_texCoord = aTextureCoord;
                }
            `;
            
            const fsSource = `
                precision highp float;
                varying vec2 v_texCoord;
                uniform float u_time;
                uniform vec2 u_resolution;

                float hash(vec2 p) {
                    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
                }

                void main() {
                    vec2 uv = v_texCoord;
                    vec2 st = uv * vec2(u_resolution.x/u_resolution.y, 1.0);
                    
                    vec3 color = vec3(0.015, 0.015, 0.02); // Deep obsidian base
                    
                    // Subtle scanning line
                    float scan = smoothstep(0.4, 0.5, sin(uv.y * 2.0 - u_time * 0.5)) * 
                                 smoothstep(0.6, 0.5, sin(uv.y * 2.0 - u_time * 0.5));
                    color += vec3(0.0, 0.1, 0.15) * scan * 0.2;
                    
                    // Faint grid
                    vec2 grid = fract(st * 40.0);
                    float lines = step(0.98, grid.x) + step(0.98, grid.y);

                const shaderProgram = gl.createProgram();
                gl.attachShader(shaderProgram, vertexShader);
                gl.attachShader(shaderProgram, fragmentShader);
                gl.linkProgram(shaderProgram);
                return shaderProgram;

            function loadShader(gl, type, source) {

                gl.shaderSource(shader, source);

            const programInfo = {

            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);

                gl.clear(gl.COLOR_BUFFER_BIT);

                gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
                gl.vertexAttribPointer(programInfo.attribLocations.vertexPosition, 2, gl.FLOAT, false, 0, 0);

<script>
(function () {
  "use strict";

  const container = document.getElementById("threejs-container");

  if (!container || typeof THREE === "undefined") {
    console.error("CodeSentinel-AI: Three.js failed to initialize.");
    return;
  }

  // Avoid duplicate animation instances during hot reloads.
  if (container.dataset.threeInitialized === "true") return;
  container.dataset.threeInitialized = "true";

  // Scene
  const scene = new THREE.Scene();

  // Camera
  const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 100);
  camera.position.set(0, 0, 6);
  camera.lookAt(0, 0, 0);

  // Renderer
  const renderer = new THREE.WebGLRenderer({
    alpha: true,
    antialias: true,
    powerPreference: "high-performance"
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);

  renderer.domElement.style.position = "absolute";
  renderer.domElement.style.inset = "0";
  renderer.domElement.style.width = "100%";
  renderer.domElement.style.height = "100%";
  renderer.domElement.style.display = "block";
  renderer.domElement.style.pointerEvents = "none";

  container.appendChild(renderer.domElement);

  // Sentinel Core
  const coreGroup = new THREE.Group();
  coreGroup.position.set(0.15, -0.05, 0);
  scene.add(coreGroup);

  const innerGeometry = new THREE.IcosahedronGeometry(1.15, 1);

  const innerMaterial = new THREE.MeshPhongMaterial({
    color: 0x00f0ff,
    emissive: 0x004b5a,
    emissiveIntensity: 1.15,
    shininess: 100,
    flatShading: true,
    transparent: true,
    opacity: 0.94
  });

  const innerMesh = new THREE.Mesh(innerGeometry, innerMaterial);
  coreGroup.add(innerMesh);

  // Outer wireframe shell
  const outerGeometry = new THREE.IcosahedronGeometry(1.78, 1);

  const outerMaterial = new THREE.MeshBasicMaterial({
    color: 0x00f0ff,
    wireframe: true,
    transparent: true,
    opacity: 0.30,
    depthWrite: false
  });

  const outerMesh = new THREE.Mesh(outerGeometry, outerMaterial);
  coreGroup.add(outerMesh);

  // Particle field
  const particleCount = 800;
  const positions = new Float32Array(particleCount * 3);

  for (let i = 0; i < particleCount; i++) {
    const i3 = i * 3;

    positions[i3] = (Math.random() - 0.5) * 12;
    positions[i3 + 1] = (Math.random() - 0.5) * 8;
    positions[i3 + 2] = (Math.random() - 0.5) * 8;
  }

  const particlesGeometry = new THREE.BufferGeometry();

  particlesGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(positions, 3)
  );

  const particlesMaterial = new THREE.PointsMaterial({
    color: 0x00f0ff,
    size: 0.025,
    transparent: true,
    opacity: 0.55,
    depthWrite: false
  });

  const particles = new THREE.Points(
    particlesGeometry,
    particlesMaterial
  );

  scene.add(particles);

  // Lighting
  scene.add(new THREE.AmbientLight(0xffffff, 0.62));

  const cyanLight = new THREE.PointLight(0x00f0ff, 2.5, 40);
  cyanLight.position.set(4, 4, 6);
  scene.add(cyanLight);

  const secondaryLight = new THREE.PointLight(0x00aabb, 1.25, 30);
  secondaryLight.position.set(-4, -3, 4);
  scene.add(secondaryLight);

  // Resize using the actual left visual panel.
  function resize() {
    const width = Math.max(container.clientWidth, 1);
    const height = Math.max(container.clientHeight, 1);

    camera.aspect = width / height;
    camera.updateProjectionMatrix();

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(width, height, false);
  }

  // Smooth animation
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);

    const time = clock.getElapsedTime();

    coreGroup.rotation.y = time * 0.42;
    coreGroup.rotation.x = Math.sin(time * 0.22) * 0.10;

    outerMesh.rotation.y = -time * 0.20;
    outerMesh.rotation.z = time * 0.10;

    const pulse = 1 + Math.sin(time * 1.5) * 0.035;
    innerMesh.scale.setScalar(pulse);

    particles.rotation.y = time * 0.025;
    particles.rotation.x = Math.sin(time * 0.12) * 0.025;

    cyanLight.position.x = Math.sin(time * 0.35) * 4;
    cyanLight.position.y = 2 + Math.cos(time * 0.28) * 3;

    renderer.render(scene, camera);
  }

  window.addEventListener("resize", resize, { passive: true });

  if ("ResizeObserver" in window) {
    const observer = new ResizeObserver(resize);
    observer.observe(container);
  }

  resize();
  animate();
})();
</script>
